[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anr-evidence"
version = "0.1.0"
description = "Android ANR evidence extraction and analysis pipeline (stdlib-only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[project.scripts]
anr-evidence = "anr_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["anr_evidence*"]
